<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ambush! — character animation runtime comparison (prototype)</title>
    <style>
      :root {
        color-scheme: dark;
        --panel: #1d2126;
        --line: #353b43;
        --text: #d8dde3;
        --dim: #8c96a3;
        --accent: #8fb46a;
        --warn: #e0a84a;
        --bad: #e06a5a;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #111;
        color: var(--text);
        font:
          12px/1.35 system-ui,
          sans-serif;
      }
      #app {
        display: grid;
        grid-template-columns: 270px 1fr 330px;
        grid-template-rows: 1fr auto;
        height: 100%;
      }
      #left,
      #right {
        background: var(--panel);
        overflow-y: auto;
        padding: 8px 10px;
      }
      #left {
        grid-row: 1 / 3;
        border-right: 1px solid var(--line);
      }
      #right {
        grid-row: 1 / 3;
        grid-column: 3;
        border-left: 1px solid var(--line);
      }
      #view {
        position: relative;
        min-width: 0;
        min-height: 0;
      }
      #c,
      #plan {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      #plan {
        display: none;
        background: #20261d;
      }
      #bottom {
        grid-column: 2;
        background: var(--panel);
        border-top: 1px solid var(--line);
        padding: 6px 10px;
        display: flex;
        gap: 8px;
        align-items: center;
      }
      #timeline {
        flex: 1;
      }
      #bottom select {
        flex: none;
      }
      h2 {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--dim);
        margin: 12px 0 4px;
        border-bottom: 1px solid var(--line);
        padding-bottom: 2px;
      }
      h2:first-child {
        margin-top: 0;
      }
      label {
        display: flex;
        align-items: center;
        gap: 6px;
        margin: 3px 0;
      }
      label > span:first-child {
        width: 92px;
        color: var(--dim);
        flex: none;
      }
      select,
      input[type='range'] {
        flex: 1;
        min-width: 0;
      }
      select,
      button {
        background: #2a3038;
        color: var(--text);
        border: 1px solid #434a54;
        border-radius: 3px;
        padding: 2px 5px;
        font: inherit;
      }
      button {
        cursor: pointer;
      }
      button:hover {
        background: #343b45;
      }
      button.on {
        background: #44602f;
        border-color: #6b8f4b;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        margin: 4px 0;
      }
      .val {
        width: 44px;
        text-align: right;
        font-variant-numeric: tabular-nums;
        color: var(--text);
      }
      pre {
        white-space: pre-wrap;
        font:
          11px/1.35 ui-monospace,
          Consolas,
          monospace;
        margin: 4px 0;
        color: #c9d1d9;
      }
      .note {
        color: var(--dim);
        font-size: 11px;
      }
      .warn {
        color: var(--warn);
      }
      .bad {
        color: var(--bad);
      }
      .ok {
        color: var(--accent);
      }
      table {
        border-collapse: collapse;
        width: 100%;
        font-size: 11px;
      }
      td,
      th {
        border-bottom: 1px solid var(--line);
        padding: 2px 3px;
        text-align: left;
      }
      td.n {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      #tags {
        position: absolute;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
      }
      .tag {
        position: absolute;
        transform: translate(-50%, -100%);
        background: #000a;
        padding: 1px 5px;
        border-radius: 3px;
        white-space: nowrap;
        font-size: 11px;
      }
      #loading {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        background: #111c;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="left"></div>
      <div id="view">
        <canvas id="c"></canvas>
        <canvas id="plan"></canvas>
        <div id="tags"></div>
        <div id="loading">Loading assets…</div>
      </div>
      <div id="bottom"></div>
      <div id="right"></div>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
