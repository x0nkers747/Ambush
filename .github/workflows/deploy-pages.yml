# Builds Ambush! and publishes it to GitHub Pages (docs/GITHUB_PAGES_DEPLOYMENT.md).
# Every push to main, or a manual run: the full check (typecheck, lint, tests,
# formatting) must pass before the site is built and deployed.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits rather than cancelling one in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The character-animation prototype has its own dependencies; the
      # check lints it with the repository's rules, so it needs them too.
      - name: Install the prototype's dependencies
        run: npm ci --prefix prototypes/character-animation

      - name: Check (typecheck, lint, tests, formatting)
        run: npm run check

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build
        run: npm run build
        env:
          # Empty: the base path comes from the repository name ("/<repository>/").
          # Set the repository variable PAGES_BASE_PATH to "/" for a custom domain.
          BASE_PATH: ${{ vars.PAGES_BASE_PATH }}

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
