<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ambush!</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, 'Segoe UI', sans-serif;
        font-size: 13px;
        --bg: #14171a;
        --panel: #1c2024;
        --line: #2c3238;
        --text: #d8dde2;
        --muted: #8a949e;
        --accent: #f2c230;
        --friendly: #4f8fe0;
        --planning: #4f8fe0;
        --executing: #3fae6a;
        --paused: #e0a63a;
        --danger: #e06a5a;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        background: var(--bg);
        color: var(--text);
      }
      #app {
        display: grid;
        grid-template-rows: auto 1fr auto;
        grid-template-columns: 1fr 330px;
        height: 100%;
      }
      header {
        grid-column: 1 / -1;
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 8px 12px;
        background: var(--panel);
        border-bottom: 1px solid var(--line);
      }
      header h1 {
        margin: 0 8px 0 0;
        font-size: 15px;
        letter-spacing: 0.04em;
      }
      .phase {
        min-width: 92px;
        padding: 3px 10px;
        border-radius: 3px;
        font-weight: 700;
        font-size: 11px;
        letter-spacing: 0.08em;
        text-align: center;
        text-transform: uppercase;
        color: #0f1215;
      }
      .phase {
        min-width: 150px;
      }
      .phase[data-phase='bluforPlanning'] {
        background: var(--planning);
      }
      .phase[data-phase='bluforOccupation'] {
        background: var(--executing);
      }
      .phase[data-phase='paused'] {
        background: var(--paused);
      }
      .phase[data-phase='bluforReady'] {
        background: #9fd17a;
      }
      .phase[data-phase='opforApproach'] {
        background: #e07a3a;
      }
      .phase[data-phase='ambushTriggered'] {
        background: var(--danger);
        color: #fff;
      }
      button.start-opfor {
        font-weight: 700;
        letter-spacing: 0.06em;
      }
      button.start-opfor.armed {
        background: #b3261e;
        border-color: #ff8a80;
        color: #fff;
        box-shadow: 0 0 0 2px rgba(255, 138, 128, 0.35);
        animation: pulse 1.6s ease-in-out infinite;
      }
      @keyframes pulse {
        50% {
          box-shadow: 0 0 0 6px rgba(255, 138, 128, 0.12);
        }
      }
      .banner {
        position: absolute;
        top: 14px;
        left: 50%;
        transform: translateX(-50%);
        max-width: 80%;
        padding: 10px 22px;
        border-radius: 6px;
        text-align: center;
        background: rgba(20, 24, 28, 0.88);
        border: 2px solid #9fd17a;
        pointer-events: none;
      }
      .banner[data-kind='triggered'] {
        border-color: var(--danger);
        background: rgba(60, 12, 10, 0.9);
      }
      .banner[hidden],
      .toast[hidden] {
        display: none;
      }
      .toast {
        position: absolute;
        bottom: 18px;
        left: 50%;
        transform: translateX(-50%);
        max-width: 70%;
        padding: 8px 16px;
        border-radius: 6px;
        background: rgba(60, 12, 10, 0.92);
        border: 1px solid var(--danger);
        color: #fff;
        pointer-events: none;
      }
      .banner-title {
        font-size: 22px;
        font-weight: 800;
        letter-spacing: 0.1em;
        color: #ff8a80;
      }
      .banner-title.ready {
        color: #9fd17a;
      }
      dl.status {
        display: grid;
        grid-template-columns: max-content 1fr;
        gap: 3px 10px;
        margin: 0 0 6px;
      }
      dl.status dt {
        color: var(--muted);
      }
      dl.status dd {
        margin: 0;
      }
      .ok {
        color: #9fd17a;
      }
      .warn {
        color: var(--paused);
      }
      .alert {
        color: #ff8a80;
        font-weight: 700;
      }
      ul.blockers {
        margin: 4px 0;
        padding-left: 18px;
        color: var(--paused);
      }
      .clock {
        font-variant-numeric: tabular-nums;
        font-size: 14px;
        min-width: 80px;
      }
      .group {
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .group .label {
        color: var(--muted);
        margin-right: 4px;
      }
      .spacer {
        flex: 1;
      }
      button {
        font: inherit;
        color: var(--text);
        background: #2a3036;
        border: 1px solid #3a424a;
        border-radius: 3px;
        padding: 5px 12px;
        cursor: pointer;
      }
      button:hover:not(:disabled) {
        background: #343b42;
      }
      button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      button.primary {
        background: #2f6a46;
        border-color: #3f8a5c;
        font-weight: 600;
      }
      button.primary:hover:not(:disabled) {
        background: #387c52;
      }
      button[aria-pressed='true'] {
        background: #3a4652;
        border-color: var(--accent);
        color: #fff;
      }
      main {
        position: relative;
        min-height: 0;
      }
      #map {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
        user-select: none;
      }
      aside {
        grid-row: 2 / 4;
        grid-column: 2;
        overflow-y: auto;
        background: var(--panel);
        border-left: 1px solid var(--line);
        padding: 12px;
      }
      aside h2 {
        margin: 14px 0 6px;
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }
      aside h2:first-child {
        margin-top: 0;
      }
      .muted {
        color: var(--muted);
      }
      .soldier-title {
        font-size: 15px;
        font-weight: 700;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-variant-numeric: tabular-nums;
      }
      td,
      th {
        padding: 2px 4px;
        text-align: right;
      }
      th {
        color: var(--muted);
        font-weight: 500;
      }
      td:first-child,
      th:first-child {
        text-align: left;
      }
      .facing {
        font-size: 18px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }
      .problems {
        color: var(--danger);
      }
      .roster-unit {
        margin-left: calc(var(--depth) * 8px);
      }
      .roster-unit-name {
        display: flex;
        align-items: center;
        gap: 5px;
        margin: 4px 0 1px;
        color: var(--muted);
        font-size: 11px;
      }
      .unit-symbol svg {
        display: block;
        height: 13px;
        width: auto;
      }
      .roster-row {
        display: grid;
        grid-template-columns: 15px 34px 1fr auto auto;
        gap: 6px;
        align-items: baseline;
        width: 100%;
        margin: 0;
        padding: 2px 6px;
        border-color: transparent;
        background: transparent;
        text-align: left;
        font-size: 12px;
        border-radius: 2px;
      }
      .roster-row .icon {
        align-self: center;
      }
      .roster-row .icon svg {
        display: block;
      }
      .roster-row .abbr {
        font-weight: 700;
      }
      .roster-row .role {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: var(--muted);
      }
      .roster-row[aria-pressed='true'] .role {
        color: #fff;
      }
      .roster-row .sid {
        font-variant-numeric: tabular-nums;
        color: var(--muted);
      }
      .roster-row .st {
        font-size: 11px;
        min-width: 78px;
        text-align: right;
      }
      .st[data-status='moving'] {
        color: var(--paused);
      }
      .st[data-status='inPosition'] {
        color: var(--executing);
      }
      .st[data-status='destinationAssigned'] {
        color: var(--friendly);
      }
      .roster-source {
        margin: 6px 0 0;
        font-size: 11px;
      }
      p.buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .events {
        margin: 0;
        padding: 0;
        list-style: none;
        font-variant-numeric: tabular-nums;
      }
      .events li {
        padding: 1px 0;
      }
      dl.help {
        display: grid;
        grid-template-columns: max-content 1fr;
        gap: 3px 10px;
        margin: 0;
      }
      dl.help dt {
        color: var(--accent);
        white-space: nowrap;
      }
      dl.help dd {
        margin: 0;
      }
      footer {
        grid-column: 1;
        padding: 4px 12px;
        background: var(--panel);
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-variant-numeric: tabular-nums;
        /* Fixed height: the pointer readout appearing must not resize the map row above. */
        height: 26px;
        line-height: 17px;
        white-space: nowrap;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
