<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ambush!</title>
    <style>
      /* One stylesheet for every stage (docs/adr/0025). Colour carries meaning
         only together with text: blue BLUEFOR and the selected tool, red OPFOR
         and combat, green readiness and progress, amber warnings and unmet
         prerequisites, grey secondary controls and metadata. */
      :root {
        color-scheme: dark;
        font-family: system-ui, 'Segoe UI', sans-serif;
        font-size: 13px;
        --bg: #14171a;
        --panel: #1b1f23;
        --panel-2: #22272c;
        --line: #2c3238;
        --text: #d8dde2;
        --muted: #8a949e;
        --blue: #4f8fe0;
        --blue-bg: #24405f;
        --green: #3fae6a;
        --green-bg: #2f6a46;
        --amber: #e0a63a;
        --red: #e06a5a;
        --red-strong: #b3261e;
        --focus: #f2c230;
        --side-w: 330px;
        --header-h: 66px;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        background: var(--bg);
        color: var(--text);
      }
      [hidden] {
        display: none !important;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }
      .muted {
        color: var(--muted);
      }
      .ok {
        color: #7fcf8f;
      }
      .warn {
        color: var(--amber);
      }
      .alert {
        color: #ff8a80;
        font-weight: 600;
      }
      h2 {
        margin: 0 0 8px;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.06em;
        color: var(--muted);
      }
      h3 {
        margin: 10px 0 4px;
        font-size: 12px;
        font-weight: 600;
      }
      p {
        margin: 4px 0;
      }
      a {
        color: var(--blue);
      }

      /* Buttons. */
      button {
        font: inherit;
        color: var(--text);
        background: #2a3036;
        border: 1px solid #3a424a;
        border-radius: 4px;
        padding: 5px 12px;
        cursor: pointer;
      }
      button:hover:not(:disabled):not([aria-disabled='true']) {
        background: #343b42;
      }
      button:disabled,
      button[aria-disabled='true'] {
        opacity: 0.45;
        cursor: default;
      }
      :focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 1px;
      }
      button.small {
        padding: 3px 9px;
        font-size: 12px;
      }
      button.link {
        background: none;
        border: 0;
        padding: 0;
        color: var(--blue);
        text-align: left;
        text-decoration: underline;
      }
      button.danger {
        border-color: var(--red);
        color: var(--red);
      }
      button.danger-solid {
        background: var(--red-strong);
        border-color: #ff8a80;
        color: #fff;
      }
      button[aria-pressed='true'] {
        background: var(--blue-bg);
        border-color: var(--blue);
        color: #fff;
      }
      button.action {
        border-color: var(--blue);
      }
      button.action.ready {
        background: var(--blue-bg);
        color: #fff;
        font-weight: 600;
      }
      .primary-btn {
        width: 100%;
        padding: 8px 12px;
        font-weight: 600;
        background: var(--green-bg);
        border-color: #3f8a5c;
        color: #fff;
      }
      .primary-btn:hover:not(:disabled):not([aria-disabled='true']) {
        background: #387c52;
      }
      .primary-btn[aria-disabled='true'] {
        background: #2a3036;
        border-color: #3a424a;
        color: var(--muted);
        opacity: 1;
      }

      /* Workflow header: Previous, the five stage segments, Next
         (assets/reference/tactical-workflow-navigation-bar.png). */
      .wf-header {
        grid-column: 1 / -1;
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        gap: 12px;
        height: var(--header-h);
        padding: 0 12px;
        background: var(--panel);
        border-bottom: 1px solid var(--line);
      }
      .wf-brand {
        font-size: 15px;
        font-weight: 800;
        letter-spacing: 0.06em;
      }
      .wf-nav {
        display: flex;
        align-items: stretch;
        height: 56px;
        padding: 3px;
        background: var(--bg);
        border: 1px solid #343b42;
        border-radius: 8px;
      }
      .wf-arrow {
        align-self: center;
        width: 36px;
        height: 36px;
        margin: 0 8px;
        padding: 0;
        font-size: 22px;
        line-height: 1;
        background: var(--panel-2);
        border-color: #3a424a;
        border-radius: 5px;
      }
      .wf-arrow:hover:not([aria-disabled='true']) {
        background: #343b42;
      }
      .wf-steps {
        display: flex;
        margin: 0;
        padding: 0 0 0 1px;
        list-style: none;
        border-left: 1px solid var(--line);
        border-right: 1px solid var(--line);
      }
      .wf-step {
        position: relative;
        display: flex;
      }
      /* Separators between segments, but not beside the current one. */
      .wf-step + .wf-step::before {
        content: '';
        position: absolute;
        left: 0;
        top: 8px;
        bottom: 8px;
        border-left: 1px solid var(--line);
      }
      .wf-step:has([aria-current='step'])::before,
      .wf-step:has([aria-current='step']) + .wf-step::before {
        display: none;
      }
      .wf-step-btn {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 3px;
        min-width: 116px;
        padding: 0 12px;
        color: var(--muted);
        background: transparent;
        border: 1px solid transparent;
        border-radius: 5px;
      }
      /* Blocked segments keep their colour: the reason is in the tooltip. */
      .wf-step-btn[aria-disabled='true'] {
        opacity: 1;
      }
      .wf-step-btn:hover:not([aria-disabled='true']):not([aria-current='step']) {
        color: var(--text);
        background: var(--panel-2);
      }
      .wf-icon {
        width: 22px;
        height: 22px;
        flex: none;
      }
      .wf-label {
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.04em;
        line-height: 1.1;
        text-transform: uppercase;
        white-space: nowrap;
      }
      .wf-step-btn[aria-current='step'] {
        color: #fff;
        cursor: default;
        background: linear-gradient(rgb(79 143 224 / 0.16), rgb(79 143 224 / 0.06));
        border-color: var(--blue);
        box-shadow:
          0 0 10px rgb(79 143 224 / 0.25),
          inset 0 0 12px rgb(79 143 224 / 0.12);
      }
      .wf-step-btn[aria-current='step'] .wf-icon {
        color: var(--blue);
      }
      /* OPFOR's icon is red when current, grey like the others when not. */
      .wf-step[data-step='opfor'] .wf-step-btn[aria-current='step'] .wf-icon {
        color: var(--red);
      }
      /* The current segment's corner marks. */
      .wf-step-btn[aria-current='step']::before,
      .wf-step-btn[aria-current='step']::after {
        content: '';
        position: absolute;
        top: 3px;
        width: 7px;
        height: 7px;
        border-top: 1px solid var(--blue);
      }
      .wf-step-btn[aria-current='step']::before {
        left: 3px;
        border-left: 1px solid var(--blue);
        border-top-left-radius: 5px;
      }
      .wf-step-btn[aria-current='step']::after {
        right: 3px;
        border-right: 1px solid var(--blue);
        border-top-right-radius: 5px;
      }
      .wf-context {
        justify-self: end;
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: var(--muted);
      }

      /* Stages 2–5: map and side panel. */
      #app.workspace,
      #app.select {
        display: grid;
        grid-template-rows: var(--header-h) minmax(0, 1fr);
        grid-template-columns: minmax(0, 1fr) var(--side-w);
        height: 100%;
      }
      .ws-map {
        display: flex;
        flex-direction: column;
        min-width: 0;
        min-height: 0;
      }
      .ws-canvas {
        position: relative;
        flex: 1;
        min-height: 0;
      }
      #map {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
        user-select: none;
      }
      .mapbar {
        display: flex;
        align-items: center;
        gap: 10px;
        height: 26px;
        padding: 0 8px 0 12px;
        background: var(--panel);
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 12px;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
        overflow: hidden;
      }
      .mapbar .pointer {
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .spacer {
        flex: 1;
      }
      .attribution {
        position: absolute;
        right: 6px;
        bottom: 6px;
        max-width: 60%;
        padding: 2px 6px;
        font-size: 10px;
        color: #1c2024;
        background: rgba(255, 255, 255, 0.72);
        border-radius: 2px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .banner {
        position: absolute;
        top: 14px;
        left: 50%;
        transform: translateX(-50%);
        max-width: 80%;
        padding: 8px 20px;
        border-radius: 6px;
        text-align: center;
        background: rgba(20, 24, 28, 0.88);
        border: 2px solid #9fd17a;
        pointer-events: none;
      }
      .banner[data-kind='triggered'] {
        border-color: var(--red);
        background: rgba(60, 12, 10, 0.9);
      }
      .banner[data-kind='complete'] {
        border-color: #c9ccd1;
      }
      .banner-title {
        font-size: 18px;
        font-weight: 800;
        letter-spacing: 0.08em;
        color: #ff8a80;
      }
      .banner-title.ready {
        color: #9fd17a;
      }
      .toast {
        position: absolute;
        bottom: 18px;
        left: 50%;
        transform: translateX(-50%);
        max-width: 70%;
        padding: 8px 16px;
        border-radius: 6px;
        background: rgba(40, 30, 10, 0.95);
        border: 1px solid var(--amber);
        color: #fff;
        pointer-events: none;
        z-index: 3;
      }
      .confirm {
        position: absolute;
        top: 12px;
        left: 50%;
        transform: translateX(-50%);
        width: min(460px, 90%);
        padding: 12px 16px;
        border-radius: 6px;
        background: var(--panel-2);
        border: 1px solid var(--red);
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.5);
        z-index: 4;
      }
      .confirm-buttons {
        display: flex;
        gap: 8px;
        margin-top: 10px;
      }

      /* Side panel. */
      .side {
        grid-row: 2;
        grid-column: 2;
        min-height: 0;
        overflow-y: auto;
        overscroll-behavior: contain;
        background: var(--panel);
        border-left: 1px solid var(--line);
      }
      .sec {
        padding: 12px 14px;
        border-bottom: 1px solid var(--line);
      }
      details.sec > summary {
        cursor: pointer;
        color: var(--muted);
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.06em;
      }
      details.sec[open] > summary {
        margin-bottom: 8px;
      }
      details.sub summary {
        cursor: pointer;
        color: var(--muted);
        margin: 6px 0 2px;
      }
      .tool-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
      }
      .tool-grid .tool:last-child:nth-child(odd) {
        grid-column: 1 / -1;
      }
      .tool-row {
        display: flex;
        gap: 6px;
        margin-top: 8px;
      }
      .hint {
        margin: 8px 0 0;
        color: var(--muted);
        font-size: 12px;
      }
      .reason {
        margin: 4px 0 8px;
        color: var(--muted);
        font-size: 12px;
      }
      .reason.warn {
        color: var(--amber);
      }
      .reason:empty {
        display: none;
      }
      /* The stage's primary action stays in reach on short screens. */
      /* The way on to the next stage: first in the side panel, and kept in
         view at its top while the rest scrolls. */
      .primary-action {
        position: sticky;
        top: 0;
        z-index: 1;
        padding: 12px 14px;
        background: var(--panel);
        border-bottom: 1px solid var(--line);
      }
      .primary-action .reason {
        margin-bottom: 0;
      }
      .msg {
        margin: 8px 0 0;
      }
      dl.kv {
        display: grid;
        grid-template-columns: max-content 1fr;
        gap: 3px 10px;
        margin: 0;
      }
      dl.kv dt {
        color: var(--muted);
      }
      dl.kv dd {
        margin: 0;
        min-width: 0;
        overflow-wrap: anywhere;
      }
      ul.blockers,
      ul.problems {
        margin: 4px 0;
        padding-left: 18px;
        color: var(--amber);
      }
      ul.problems {
        color: #ff8a80;
      }
      .selection {
        margin-top: 10px;
      }
      .selection:empty {
        display: none;
      }
      .soldier-title {
        font-size: 14px;
        font-weight: 700;
      }
      .facing {
        font-variant-numeric: tabular-nums;
        font-weight: 700;
      }
      p.buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      ol.team-members,
      .route-list {
        margin: 4px 0;
        padding-left: 18px;
      }
      .coming-soon {
        font-size: 16px;
        font-weight: 700;
        color: var(--amber);
      }

      /* Simulation controls. */
      .sim-row {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 8px;
      }
      .clock {
        font-size: 16px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        min-width: 96px;
      }
      .sim-state {
        color: var(--muted);
      }
      .sim-state[data-phase='bluforOccupation'],
      .sim-state[data-phase='opforApproach'] {
        color: var(--green);
      }
      .sim-state[data-phase='paused'] {
        color: var(--amber);
      }
      .sim-state[data-phase='engagement'] {
        color: #ff8a80;
      }
      .speed {
        display: flex;
        gap: 4px;
      }
      .speed button {
        flex: 1;
        padding: 3px 0;
        font-variant-numeric: tabular-nums;
      }

      /* OPFOR & combat. */
      .combat-actions button {
        width: 100%;
      }
      button.action.ready[data-ui='start-opfor'] {
        background: #5a2a24;
        border-color: var(--red);
      }
      button.trigger-ambush {
        margin-top: 4px;
        min-height: 36px;
        font-weight: 800;
        letter-spacing: 0.06em;
        background: var(--red-strong);
        border: 2px solid #ff8a80;
        color: #fff;
      }
      button.trigger-ambush:hover:not(:disabled) {
        background: #cf3328;
      }
      button.trigger-ambush:disabled {
        background: #3a2321;
      }
      button.trigger-ambush[data-state='queued'],
      button.trigger-ambush[data-state='triggered'] {
        opacity: 1;
        background: #5a1612;
        border-style: dashed;
      }
      .readouts {
        margin-top: 8px;
        font-variant-numeric: tabular-nums;
      }
      table.engagement-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 12px;
        margin: 4px 0 8px;
        font-variant-numeric: tabular-nums;
      }
      table.engagement-table th {
        text-align: left;
        font-weight: normal;
        color: var(--muted);
      }
      table.engagement-table td {
        text-align: right;
      }
      table.engagement-table.soldiers td:last-child {
        text-align: left;
        padding-left: 8px;
      }
      table.engagement-table tr[data-side='OPFOR'] th {
        color: #ff8a80;
      }
      .events {
        margin: 0;
        padding: 0;
        list-style: none;
        font-variant-numeric: tabular-nums;
        font-size: 12px;
      }
      .events li {
        padding: 1px 0;
      }
      dl.help {
        display: grid;
        grid-template-columns: max-content 1fr;
        gap: 3px 10px;
        margin: 0;
      }
      dl.help dt {
        color: var(--focus);
        white-space: nowrap;
      }
      dl.help dd {
        margin: 0;
      }
      .bf-warnings {
        margin: 6px 0;
        padding-left: 18px;
        color: var(--amber);
      }
      .credits {
        padding-left: 18px;
        margin: 4px 0;
        color: var(--muted);
      }

      /* Roster. */
      .roster-unit {
        margin-left: calc(var(--depth) * 8px);
      }
      .roster-unit-name {
        display: flex;
        align-items: center;
        gap: 5px;
        margin: 4px 0 1px;
        color: var(--muted);
        font-size: 11px;
      }
      button.roster-unit-name.team {
        width: 100%;
        padding: 2px 6px;
        border: 1px solid transparent;
        border-radius: 2px;
        background: transparent;
        font-weight: 600;
        text-align: left;
        color: var(--text);
      }
      button.roster-unit-name.team:hover {
        border-color: var(--line);
      }
      button.roster-unit-name.team[aria-pressed='true'] {
        border-color: var(--blue);
        background: var(--blue-bg);
        color: #fff;
      }
      .roster-unit.team-selected {
        border-left: 2px solid var(--blue);
      }
      .unit-symbol svg {
        display: block;
        height: 13px;
        width: auto;
      }
      .roster-row {
        display: grid;
        grid-template-columns: 15px 34px 1fr auto auto;
        gap: 6px;
        align-items: baseline;
        width: 100%;
        margin: 0;
        padding: 2px 6px;
        border-color: transparent;
        background: transparent;
        text-align: left;
        font-size: 12px;
        border-radius: 2px;
      }
      .roster-row .icon {
        align-self: center;
      }
      .roster-row .icon svg {
        display: block;
      }
      .roster-row .abbr {
        font-weight: 700;
      }
      .roster-row .role {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: var(--muted);
      }
      .roster-row[aria-pressed='true'] .role {
        color: #fff;
      }
      .roster-row .sid {
        font-variant-numeric: tabular-nums;
        color: var(--muted);
      }
      .roster-row .st {
        font-size: 11px;
        min-width: 70px;
        text-align: right;
      }
      .st[data-status='moving'] {
        color: var(--amber);
      }
      .st[data-status='inPosition'] {
        color: var(--green);
      }
      .st[data-status='destinationAssigned'] {
        color: var(--blue);
      }
      .roster-source {
        margin: 6px 0 0;
        font-size: 11px;
      }

      /* Stage 1: terrain selection, in the same layout as the other stages. */
      .sel-placeholder {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
        color: var(--muted);
      }
      .sel-name {
        margin: 0 0 6px;
        font-size: 14px;
        font-weight: 700;
      }
      .sel-credits {
        padding: 12px 14px;
        font-size: 11px;
        line-height: 1.5;
      }
      .sel-card {
        width: min(560px, 100%);
        padding: 16px 18px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 6px;
      }
      .sel-card h2 {
        font-size: 16px;
        letter-spacing: 0;
        color: var(--text);
      }
      .sel-card .bf-row {
        margin-top: 12px;
      }
      .sel-card .primary-btn {
        width: auto;
        padding: 8px 18px;
      }
      /* The battlefield preview fills the map area. */
      .sel-preview {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
      }
      .preview-map {
        position: relative;
        flex: 1;
        min-height: 0;
      }
      .preview-canvas {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
        user-select: none;
      }
      .preview-status {
        position: absolute;
        inset: 0 0 26px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        text-align: center;
        color: var(--muted);
        background: rgba(20, 23, 26, 0.6);
      }
      .sel-preview .attribution {
        bottom: 32px;
      }
      .fatal {
        padding: 40px 24px;
      }
      .bf-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: end;
      }
      .bf-row label {
        display: flex;
        flex-direction: column;
        gap: 3px;
        color: var(--muted);
        font-size: 12px;
      }
      .bf-row label.grow {
        flex: 1;
        min-width: 0;
      }
      input {
        font: inherit;
        color: var(--text);
        background: #12151a;
        border: 1px solid #3a424a;
        border-radius: 4px;
        padding: 5px 8px;
        width: 110px;
      }
      .bf-row label.grow input {
        width: 100%;
      }
      .bf-results,
      .bf-steps {
        margin: 8px 0 0;
        padding-left: 18px;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .bf-results .no-results {
        list-style: none;
        margin-left: -18px;
      }
      .bf-results .no-results p {
        margin: 0 0 4px;
      }
      .bf-saved {
        margin: 0;
        padding: 0;
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      /* The saved list shows five rows and scrolls on its own, so the rest of
         the panel stays put however many battlefields there are. Rows are one
         height (names are cut, not wrapped); the padding keeps focus outlines
         inside the scrolling box. */
      .bf-saved[data-ui='saved'] {
        --bf-row-h: 47px;
        position: relative;
        max-height: calc(5 * var(--bf-row-h) + 4 * 4px + 4px);
        overflow-y: auto;
        overscroll-behavior: contain;
        padding: 2px 4px 2px 2px;
        margin: -2px -4px -2px -2px;
      }
      .bf-saved-row {
        flex: none;
        height: var(--bf-row-h);
      }
      .bf-saved-row {
        display: flex;
        align-items: stretch;
        gap: 4px;
      }
      .bf-item {
        display: flex;
        flex-direction: column;
        flex: 1;
        min-width: 0;
        gap: 2px;
        text-align: left;
        background: transparent;
        border-color: var(--line);
      }
      /* A saved battlefield's bin: grey, red on hover, solid red when armed. */
      .bf-delete {
        flex: none;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 32px;
        padding: 0;
        color: var(--muted);
        background: transparent;
        border-color: var(--line);
      }
      .bf-delete:hover:not(:disabled) {
        color: var(--red);
        border-color: var(--red);
        background: transparent;
      }
      .bf-delete[data-confirm='yes'],
      .bf-delete[data-confirm='yes']:hover:not(:disabled) {
        color: #fff;
        background: var(--red-strong);
        border-color: #ff8a80;
      }
      .bf-item b,
      .bf-item span {
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .bf-item span {
        font-size: 12px;
      }
      .bf-steps li[data-state='done'] {
        color: var(--green);
      }
      .bf-steps li[data-state='done']::after {
        content: ' ✓';
      }
      .bf-steps li[data-state='active'] {
        font-weight: 600;
      }
      .bf-steps li[data-state='failed'] {
        color: var(--red);
        font-weight: 600;
      }
      .bf-steps li[data-state='waiting'] {
        color: var(--muted);
      }
      .bf-error {
        margin-top: 8px;
        padding-left: 8px;
        border-left: 3px solid var(--red);
      }

      /* Smaller screens. */
      @media (max-width: 1100px) {
        :root {
          --side-w: 300px;
        }
        .wf-context {
          display: none;
        }
        .wf-header {
          grid-template-columns: auto 1fr;
        }
        .wf-nav {
          justify-self: center;
        }
        .wf-step-btn {
          min-width: 92px;
          padding: 0 8px;
        }
      }
      @media (max-width: 900px) {
        .wf-brand {
          display: none;
        }
        .wf-header {
          grid-template-columns: 1fr;
        }
      }
      @media (max-width: 760px) {
        /* Only the current segment keeps its label. */
        .wf-step-btn {
          min-width: 50px;
        }
        .wf-step-btn[aria-current='step'] {
          min-width: 104px;
        }
        .wf-step-btn:not([aria-current='step']) .wf-label {
          display: none;
        }
        .wf-arrow {
          margin: 0 4px;
        }
        #app.workspace,
        #app.select {
          grid-template-columns: 1fr;
          grid-template-rows: var(--header-h) 60vh auto;
          height: auto;
        }
        .side {
          grid-row: 3;
          grid-column: 1;
          border-left: 0;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
