<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ambush! — individual soldier icons</title>
    <style>
      body {
        margin: 0;
        padding: 24px 32px 48px;
        font:
          14px/1.45 system-ui,
          sans-serif;
        background: #f6f6f3;
        color: #15191d;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 24px;
      }
      h2 {
        margin: 32px 0 8px;
        font-size: 17px;
      }
      p {
        margin: 0 0 12px;
        max-width: 70ch;
        color: #4a5058;
      }
      table {
        border-collapse: collapse;
      }
      th,
      td {
        padding: 6px 12px;
        text-align: center;
        vertical-align: middle;
      }
      th {
        font-weight: 600;
        font-size: 12px;
        color: #4a5058;
      }
      th.row {
        text-align: left;
      }
      td svg,
      td canvas {
        display: inline-block;
        vertical-align: middle;
      }
      .pair {
        display: inline-flex;
        gap: 6px;
        align-items: center;
      }
      .terrain {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }
      .terrain canvas {
        border-radius: 4px;
      }
      .maps {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(460px, 1fr));
        gap: 16px;
      }
      .maps figure {
        margin: 0;
      }
      .maps canvas {
        display: block;
        width: 100%;
        height: 320px;
        border-radius: 4px;
        background: #1b1f23;
      }
      .maps figcaption {
        margin-top: 4px;
        font-size: 12px;
        color: #4a5058;
      }
    </style>
  </head>
  <body>
    <h1>Individual soldier icons</h1>
    <p>
      Development reference for docs/adr/0013. Custom Ambush! symbols, not APP-6. Design authority:
      assets/reference/individual-soldier-icons.png.
    </p>
    <div id="gallery"></div>
    <script type="module" src="/src/app/symbols.ts"></script>
  </body>
</html>
